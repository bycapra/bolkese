services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      ALTINAPI_KEY: ${ALTINAPI_KEY}
    volumes:
      - bolkese-data:/app/data
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  bolkese-data:
